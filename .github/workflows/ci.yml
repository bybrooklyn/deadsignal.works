name: Site CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        run: bun run check:security

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check and build site
        run: bun run check:site

      - name: Install browser engines
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Expose Playwright Chromium to Lighthouse
        run: |
          echo "CHROME_PATH=$(bun -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Test accessibility and interactions
        run: bun run test:e2e:built

      - name: Audit representative routes with Lighthouse
        # GitHub-hosted runners do not expose the user namespace needed by
        # Playwright's bundled Chromium sandbox. Keep this exception scoped to
        # Lighthouse CI; production and Playwright browser launches are unchanged.
        run: bun run audit:lighthouse -- --collect.settings.chromeFlags="--no-sandbox --disable-setuid-sandbox"
